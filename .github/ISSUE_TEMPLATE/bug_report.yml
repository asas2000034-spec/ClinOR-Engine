name: Bug report
about: Report a reproducible software bug (no real patient information)
title: "[BUG] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not submit PHI, identifiable clinical records, credentials or proprietary guidelines."
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and reproduction steps
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Python/OS and version
