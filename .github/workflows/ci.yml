name: Quality gates
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,ai,cp]'
      - run: python -m pytest -q
      - run: python -m compileall -q clinor
      - run: ruff check .
      - run: python -m pip install pip-audit pytest-cov
      - run: pip-audit --skip-editable
      - run: python -m pytest --cov=clinor --cov-report=term
