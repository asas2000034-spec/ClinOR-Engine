# Local-only LLM service alongside the app; no AI API key required.
# Start: docker compose -f docker-compose.ollama.yml up -d --build
# Pull a model: docker compose -f docker-compose.ollama.yml exec ollama ollama pull qwen2.5:3b
services:
  app:
    build: .
    ports:
      - '127.0.0.1:8000:8000'
    environment:
      CLINOR_LLM_PROVIDER: ollama
      CLINOR_LLM_DEPLOYMENT: local
      CLINOR_LLM_MODEL: qwen2.5:3b
      CLINOR_LLM_BASE_URL: http://ollama:11434
      CLINOR_LLM_TIMEOUT: '120'
    depends_on:
      - ollama
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    # No external host port is published for the model server.
volumes:
  ollama_models:
