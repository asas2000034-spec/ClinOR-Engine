[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinor-engine"
version = "0.3.1"
description = "Open-source, evidence-grounded clinical research and reviewed decision optimization framework"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "ClinOR Contributors"}]
dependencies = [
  "fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0",
  "httpx>=0.27,<1.0", "pydantic>=2.8,<3.0", "scipy>=1.12,<2.0",
  "python-dotenv>=1.0,<2.0"
]

[project.optional-dependencies]
ai = []
ai-web = ["openai>=1.60,<3.0"]
cp = ["ortools>=9.10,<10"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2.0", "ruff>=0.8,<1.0"]

[tool.setuptools.packages.find]
include = ["clinor*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.package-data]
"clinor" = ["static/*", "static/brand/*.svg"]
